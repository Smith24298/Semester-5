<!DOCTYPE html>
<html lang="en">
<head>
    <title> Bootstrap 5 container Example </title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js">

    </script>
    <style>
        body {
            border: 2px solid black;
        }
    </style>
</head>
<body>


    <div class="container-fluid">
        <div class="row">

            <div class="col-md-4 col-sm-12">
                Content 1
            </div>
            <div class="col-md-4 col-sm-12">
                Content 2
            </div>
            <div class="col-md-4 col-sm-12">
    Content 3
</div>
        </div>

    </div>
    <div class="container-fluid bg-info">
        <h1> Bootstrap 5 Container </h1>
        <b> The container class gives a responsive or fixed width in page </b>
        <p> Containers are a core Bootstrap building piece that contain and align your content within a specific device or viewport. </p>
        <div class="row" style="border : 3px solid Yellow;">
            <div class="col" style="border : 5px solid black;"> Bootstrap </div>
            <div class="col" style="border : 10px solid red;"> Bootstrap 4 </div>
            <div class="col" style="border : 20px solid black;"> Bootstrap 5 </div>
        </div>
    </div>
</body>
</html>
