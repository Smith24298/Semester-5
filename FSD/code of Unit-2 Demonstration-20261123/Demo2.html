<!DOCTYPE html>
<html>
<meta name="viewport" content="width=device-width, initial-scale=1.0">


<body>
    <h2>Responsive Image</h2>
    <p>When we set the CSS width property to 100%, it makes the image responsive.  Resize the browser window to see the effect.</p>

    <img src="img_girl.jpg" style="width:100%;">(Change the image)
    <img src="logo.jpeg" style="width:100%;">(Change the image)

    <img src="logo.jpeg" style="max-width:100%;height:auto;"> (Change the image)

    <img src="img_girl.jpg" style="max-width:100%;height:auto;"> (Change the image)

</body>
</html>
