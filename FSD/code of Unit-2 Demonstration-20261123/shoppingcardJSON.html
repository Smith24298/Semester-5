<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vue Product Cart</title>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>

<body>

    <div id="app">

        <h1>Product Store</h1>

        <!-- Product List -->
        <h2>Products</h2>

        <div v-for="product in products" :key="product.id">

            <h3>{{ product.name }}</h3>
            <p>Price: ₹{{ product.price }}</p>

            <button @click="addToCart(product)">
                Add to Cart
            </button>

            <hr>

        </div>


       
        <h2>Shopping Cart</h2>

        <p v-if="cart.length == 0">
            Cart is Empty
        </p>

        <div v-else>

            <div v-for="item in cart" :key="item.id">

                <h3>{{ item.name }}</h3>

                <p>Price: ₹{{ item.price }}</p>

                <p>Quantity: {{ item.quantity }}</p>

                <button @click="increaseQuantity(item)">
                    +
                </button>

                <button @click="decreaseQuantity(item)">
                    -
                </button>

                <p>
                    Item Total: ₹{{ item.price * item.quantity }}
                </p>

                <hr>

            </div>

            <h3>Total Items: {{ totalItems }}</h3>

            <h2>Total Price: ₹{{ totalPrice }}</h2>

        </div>

    </div>


    <script>

        const app = Vue.createApp({

            data() {

                const productJSON = `[
                {
                    "id": 1,
                    "name": "Laptop",
                    "price": 50000
                },
                {
                    "id": 2,
                    "name": "Mouse",
                    "price": 500
                },
                {
                    "id": 3,
                    "name": "Keyboard",
                    "price": 1500
                }
            ]`;

                return {

                    products: JSON.parse(productJSON),

                    cart: []
                };
            },


            computed: {

              totalItems() {

                    let total = 0;

                    for (let i = 0; i < this.cart.length; i++) {

                        total = total + this.cart[i].quantity;

                    }

                    return total;
                },


                totalPrice() {

                    let total = 0;

                    for (let i = 0; i < this.cart.length; i++) {

                        total = total +
                            (this.cart[i].price * this.cart[i].quantity);

                    }

                    return total;
                }

            },


            methods: {

                
                addToCart(product) {

                    let found = false;

                    
                    for (let i = 0; i < this.cart.length; i++) {

                        if (this.cart[i].id == product.id) {

                            this.cart[i].quantity++;

                            found = true;

                            break;
                        }
                    }

                    if (found == false) {

                        this.cart.push({
                            id: product.id,
                            name: product.name,
                            price: product.price,
                            quantity: 1
                        });

                    }
                },


               increaseQuantity(item) {

                    item.quantity++;

                },


                decreaseQuantity(item) {

                    if (item.quantity > 1) {

                        item.quantity--;

                    }

                }

            }

        });


        app.mount("#app");

    </script>

</body>
</html>
