[project]
name = "taskflow"
version = "0.1.0"
description = "A polished FastAPI and MySQL todo application"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.36",
    "pymysql>=1.1.1",
    "python-dotenv>=1.0.1",
]

[dependency-groups]
dev = [
    "httpx>=0.27.2",
    "pytest>=8.3.0",
]

[tool.uv]
package = false
