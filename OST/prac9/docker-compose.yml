services:
  mysql:
    image: mysql:8.4
    container_name: taskflow-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: taskflow
      MYSQL_USER: todo_user
      MYSQL_PASSWORD: todo_password
      MYSQL_ROOT_PASSWORD: root_password
    ports:
      - "3307:3306"
    volumes:
      - taskflow_mysql:/var/lib/mysql

volumes:
  taskflow_mysql:
