<!DOCTYPE html>
<html>
<head>
    <title>My first Vue page</title>
    <style>
        #app {
            display: inline-block;
            padding: 10px;
            font-size: x-large;
            background-color: lightgreen;
        }
    </style>
</head>
<body>

    <h1>Vue Example</h1>

    <p>The message is taken from 'data' inside the Vue instance by writing {{ message }} inside the div with id="app".</p>

    <div id="app1">

        <p> Message is : {{ message }}  Visit count : {{count}} </p><br />
        <input type-="text" v-model="message" value="new Data" />

        <button @click="count++"  > + </button>
        <button @click="count--" v-if="count > 0"> - </button>
        <!--<input type="Text" v-model="message" />
    <input type="button" value="+" v-on:click="count++" />
    <input type="button" value="-" v-if="count > 0" @click="count--" />-->


    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <script>
        const app = Vue.createApp({
            data() {
                return {
                    message: "Hello World!" , count:0
                }
            }
        })

        app.mount('#app1')

    </script>

</body>
</html>
