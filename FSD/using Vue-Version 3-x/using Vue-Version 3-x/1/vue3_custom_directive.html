<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue 3 Custom Directive Example</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body>
    <div id="app">
        <h1>Vue 3 Custom Directive Example</h1>

        <p v-uppercase>
            Hello, this text will be uppercased when clicked!
        </p>
    </div>

    <script src="app.js"></script>
</body>
</html>
